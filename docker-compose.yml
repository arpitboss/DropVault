services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dropvault-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - NODE_ENV=${NODE_ENV:-development}
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017/dropvault}
      - MASTER_ENCRYPTION_KEY=${MASTER_ENCRYPTION_KEY}
      - UPLOAD_DIR=/app/uploads
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-52428800}
      - MAX_TEXT_SIZE=${MAX_TEXT_SIZE:-1048576}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app-uploads:/app/uploads
    networks:
      - dropvault-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  mongo:
    image: mongo:7
    container_name: dropvault-mongo
    restart: unless-stopped
    # Security: MongoDB is NOT exposed to the host network by default (V0-T14).
    # It is strictly isolated and accessible only via the internal bridge network.
    volumes:
      - mongo-data:/data/db
    networks:
      - dropvault-network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand(\"ping\")' --quiet || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: dropvault-redis
    restart: unless-stopped
    # Security: Redis is NOT exposed to the host network by default (V1-T01).
    # It is strictly isolated and accessible only via the internal bridge network.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - dropvault-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  mongo-data:
    name: dropvault-mongo-data
  app-uploads:
    name: dropvault-app-uploads
  redis-data:
    name: dropvault-redis-data

networks:
  dropvault-network:
    name: dropvault-network
    driver: bridge
